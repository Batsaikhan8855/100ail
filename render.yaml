# Render Blueprint — 100 Айл-ын backend ба PostgreSQL.
#
# Ашиглах: Render дээр New → Blueprint → энэ repo-г сонгоно.
# Frontend гурван апп нь Vercel дээр байрлана (доорх CORS_ORIGINS-ыг
# тэдгээрийн домэйнээр солино).
#
# Redis болон Meilisearch энд байхгүй — тохируулаагүй үед код нь
# доголдолгүй нөөц зам руу шилждэг (ажлууд шууд гүйцэтгэгдэж, хайлт
# PostgreSQL дээр ажиллана). Ачаалал нэмэгдвэл дараа нь нэмнэ.

databases:
  - name: ail100-db
    databaseName: ail100
    user: ail100
    plan: free

services:
  - type: web
    name: ail100-api
    runtime: docker
    plan: free
    region: frankfurt
    # Repo-гийн үндсэн Dockerfile (контекст нь бас үндэс). Render нь
    # Dockerfile-ын замыг Root Directory-оос үл хамааран үндэснээс
    # тоолдог тул энэ хувилбар нь ямар ч тохиргоонд ажиллана.
    dockerfilePath: ./Dockerfile
    # PORT-ыг Render өөрөө оноодог; `main.ts` нь `process.env.PORT`-ыг
    # уншдаг тул энд хатуу заахгүй (заавал заавал зөрчил үүсгэж болзошгүй).
    healthCheckPath: /api/docs
    # Схемийн тохируулга, суурь өгөгдөл, каталогийн импорт нь
    # `backend/docker-entrypoint.sh` дотор хийгддэг — Render-ийн үнэгүй
    # тариф `preDeployCommand` дэмждэггүй тул.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ail100-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PLATFORM_COMMISSION_RATE
        value: "0.02"
      # Vercel-ийн домэйнуудаар солино, жишээ нь:
      #   https://100ail.vercel.app,https://*.vercel.app
      # Орлуулагч дэмжигддэг тул preview deploy бүрд гараар нэмэх шаардлагагүй.
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      # Зураг: S3/R2 тохируулаагүй тул барааны зураг эх сайтын хаягаар
      # холбогдоно. Өөрийн санд шилжүүлэх бол S3_* утгуудыг нэмж,
      # S3_PUBLIC_URL-ыг bucket-ийн нийтийн хаягаар тавина.
      - key: MEDIA_DIR
        value: media
