name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — typecheck, unit, e2e
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ail100
          POSTGRES_PASSWORD: ail100
          POSTGRES_DB: ail100
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ail100"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ail100:ail100@localhost:5432/ail100?schema=public
      JWT_SECRET: ci-secret
      PLATFORM_COMMISSION_RATE: "0.02"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test

      - name: Өгөгдлийн сан бэлтгэх
        run: npm run db:push && npm run db:seed:demo

      - name: E2E тест (дараалал Redis дээр)
        run: npm run test:e2e
        env:
          REDIS_URL: redis://localhost:6379

  web:
    name: ${{ matrix.app }} — typecheck, build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: [storefront, supplier, admin]

    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
